name: Build and Deploy using PM2

on:
  push:
    branches:
      - dev
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repo
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Application
        run: npm run build

      # 3. Deploy to EC2 via SSH and manage with PM2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 300s
          command_timeout: 600s
          script: |
            cd /home/ubuntu
            echo "📁 Entered /home/ubuntu directory"

            # Ensure NVM is loaded
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Install PM2 globally if not installed
            if ! command -v pm2 &> /dev/null; then
              echo "🔧 Installing PM2 globally..."
              npm install -g pm2
            fi

            if [ ! -d "Codeverse-Academy" ]; then
              echo "🧬 Cloning repository..."
              git clone https://github.com/Aashish17405/Codeverse-Academy.git 
            fi        

            cd Codeverse-Academy
            echo "📦 In Codeverse-Academy directory, pulling latest code..."

            git fetch origin main
            git reset --hard origin/main

            echo "🌱 Setting environment..."
            echo "EMAIL_USER=${{ secrets.EMAIL_USER }}" > .env.local
            echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> .env.local
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env.local
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.local
            echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env.local
            echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> .env.local
            echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> .env.local

            echo "📦 Installing dependencies..."
            npm install --legacy-peer-deps

            echo "🔑 Generating Prisma client..."
            npx prisma generate 

            echo "⚒️ Building project..."
            npm run build

            if pm2 list | grep -q "nextjs-app"; then
              echo "🛑 Stopping existing app..."
              pm2 stop nextjs-app
              pm2 delete nextjs-app
            fi

            echo "🚀 Starting app with PM2..."
            pm2 start npm --name "nextjs-app" -- start

            echo "✅ Deployment completed successfully!"
            pm2 status
